# Pandoc defaults for sections/*.md → pandoc/*.tex conversion
# Usage: pandoc --defaults pandoc/defaults.yaml -o pandoc/01_intro.tex sections/01_intro.md
#   Override mode: --metadata mode=submission

from: markdown+raw_tex+tex_math_dollars+fenced_divs+bracketed_spans
to: latex

metadata-files:
  - pandoc/acronyms.yaml

filters:
  - pandoc/filters/acronyms.lua
  - pandoc/filters/abstract.lua
  - pandoc/filters/cut-candidates.lua
  - pandoc/filters/tables.lua
  - pandoc/filters/annotations.lua
  - pandoc/filters/code-blocks.lua

cite-method: natbib
wrap: preserve

## mode is set by build.sh via --metadata mode=draft|submission
## Do not set it here — pandoc concatenates rather than overrides metadata values.
