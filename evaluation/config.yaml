# Measurement campaign configuration
# VC Ecosystem Metamodel — MODELS 2026

# Refinery CLI Docker image
refinery_image: "ghcr.io/graphs4value/refinery-cli:latest"

# Scale points for E1/E2
scale_points: [1, 3, 5, 10, 15, 20, 30]

# Properties per credential (fixed)
props_per_credential: 1

# Hyperfine settings
runs: 10
warmup: 1
time_limit: 300  # seconds

# E3: Constraint sensitivity configurations (power-set of governance)
# Each config lists which governance types are active
sensitivity_configs:
  G0: []
  G1: [eidas]
  G2: [privacy]
  G3: [vcdm]
  G4: [eidas, privacy]
  G5: [eidas, vcdm]
  G6: [privacy, vcdm]
  G7: [eidas, privacy, vcdm]

# E3 uses N=3 (CSOK canonical size)
sensitivity_n: 3

# ED (AF02 / Q-007): structurally diverse instances.
# Uniform instances (E1/E2) are a depth-1 star: N credentials all describing the
# single Applicant. These "diverse" instances chain credentials (a credential can
# describe the value of its parent credential), realizing deeper claim hierarchies
# and multi-subject credentials. Two families:
diverse:
  # (a) Depth sweep at fixed N: isolate the effect of chain depth. N=12 so every
  #     listed depth divides it evenly (breadth = 12/depth), holding node count
  #     roughly constant while the domain-graph diameter grows.
  depth_sweep_n: 12
  depth_sweep_depths: [1, 2, 3, 4, 6, 12]
  # (b) Depth-fixed N-sweep: does the sublinear-in-N scaling of the uniform
  #     instances survive when instances are chained? Same N points as E1/E2,
  #     SAT and UNSAT, at a fixed chain depth.
  scale_depth: 4
  scale_points: [1, 3, 5, 10, 15, 20, 30]
